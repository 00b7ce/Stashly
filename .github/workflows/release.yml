name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-windows:
    name: Windows x64 NSIS
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $packageVersion = node -p "require('./package.json').version"
          $lockVersion = node -p "require('./package-lock.json').version"
          $tauriVersion = node -p "require('./src-tauri/tauri.conf.json').version"
          $cargoMatch = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $cargoMatch) {
            throw "Could not read the package version from src-tauri/Cargo.toml"
          }
          $cargoVersion = $cargoMatch.Matches[0].Groups[1].Value

          $versions = @($packageVersion, $lockVersion, $tauriVersion, $cargoVersion)
          if (($versions | Select-Object -Unique).Count -ne 1) {
            throw "Version mismatch: package=$packageVersion lock=$lockVersion tauri=$tauriVersion cargo=$cargoVersion"
          }
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "Tag $env:RELEASE_TAG must equal v$packageVersion"
          }

      - name: Run frontend tests
        run: npm run test

      - name: Check frontend build
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Verify updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured"
          }

      - name: Generate release body
        id: release_body
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $currentTag = $env:GITHUB_REF_NAME
          $releaseTags = @(git tag --merged HEAD --sort=-version:refname --list "v*")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read release tags"
          }
          if ($currentTag -notin $releaseTags) {
            throw "Current release tag $currentTag was not found"
          }

          $previousTag = $releaseTags |
            Where-Object { $_ -ne $currentTag } |
            Select-Object -First 1
          $range = if ($previousTag) { "$previousTag..$currentTag" } else { $currentTag }

          $commitLines = @(git log $range --pretty=format:"%H`t%h`t%s" | ForEach-Object {
            $parts = $_ -split "`t", 3
            if ($parts.Count -ne 3) {
              throw "Could not parse commit metadata"
            }
            $subject = $parts[2].Replace("\\", "\\\\").Replace("[", "\[").Replace("]", "\]")
            "- [$($parts[1])]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit/$($parts[0])) $subject"
          })
          if ($LASTEXITCODE -ne 0) {
            throw "Could not generate the commit list"
          }
          if ($commitLines.Count -eq 0) {
            $commitLines = @("- コミットはありません。")
          }

          $body = @(
            "Windows x64向けの未署名NSISインストーラです。"
            ""
            "このReleaseはドラフトです。動作確認後に手動で公開してください。"
            ""
            "## 変更履歴"
            ""
          )
          if ($previousTag) {
            $body += "[$previousTag から $currentTag までの差分]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/compare/$previousTag...$currentTag)"
            $body += ""
          } else {
            $body += "初回リリースのため、リポジトリ開始時点からのコミットを掲載します。"
            $body += ""
          }
          $body += $commitLines

          $delimiter = "release-body-$([guid]::NewGuid())"
          "body<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build NSIS installer and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Stashly v__VERSION__"
          releaseBody: ${{ steps.release_body.outputs.body }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: --bundles nsis
