[package]
name = "booth-shelf"
version = "1.0.0"
description = "An unofficial local library manager for BOOTH downloads"
authors = ["mekabu"]
license = "MIT"
edition = "2024"

[lib]
name = "booth_shelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.11.5", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6", default-features = false, features = ["bzip2", "deflate", "deflate64", "lzma", "ppmd", "xz", "zstd"] }

[dev-dependencies]
tempfile = "3"
